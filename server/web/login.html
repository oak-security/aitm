<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AiTM — sign in</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f6f5; }
      .login-card { background: #fff; border: 1px solid #e3e1de; border-radius: 14px; padding: 40px 44px; max-width: 420px; text-align: center; }
      .login-card img.mark { width: 72px; height: 72px; margin-bottom: 14px; }
      .login-card h1 { margin: 0 0 6px; font-size: 1.5rem; }
      .login-card p { color: #6f747a; margin: 0 0 22px; }
      .login-error { color: #9c0069; margin: 14px 0 0; font-size: 0.9rem; }
      .login-btn { display: inline-block; background: #000; color: #fff; border-radius: 10px; padding: 12px 22px; text-decoration: none; font-weight: 600; }
      .login-btn:hover { background: linear-gradient(90deg, #ffc965, #9c0069); }
      .login-oak { margin-top: 26px; display: flex; gap: 8px; align-items: center; justify-content: center; color: #6f747a; font-size: 0.8rem; }
      .login-oak img { height: 16px; filter: invert(1); }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <img class="mark" src="assets/logo/aitm-mark.svg" alt="AiTM" />
        <h1>AiTM</h1>
        <p>AI Threat Modeller · TRACE.<br />Access is limited to members of {{ORG}}.</p>
        <a class="login-btn" href="/auth/github">Sign in with GitHub</a>
        {{MESSAGE}}
        <div class="login-oak"><span>by</span><img src="assets/logo/oak-white.svg" alt="Oak Security" /></div>
      </div>
    </div>
  </body>
</html>
