<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AiTM · TRACE workbench</title>
    <link rel="icon" type="image/svg+xml" href="/ui/assets/aitm-mark.svg" />
    <link rel="stylesheet" href="/ui/styles.css" />
    <script type="module" src="/ui/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#workspace">Skip to workspace</a>
    <div class="shell">
      <aside id="sidebar" aria-label="Assessment navigation"></aside>
      <div class="workspace-shell">
        <header id="topbar"></header>
        <div id="error" role="alert" hidden></div>
        <main id="workspace" tabindex="-1"><div class="loading">Opening AiTM…</div></main>
      </div>
      <footer id="activity" role="status" aria-live="polite"></footer>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <noscript>AiTM needs JavaScript to run the local workbench.</noscript>
  </body>
</html>
