<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AiTM mark">
  <!-- Attack-tree glyph: a root node with two descending edges to child nodes.
       Gold on transparent so it sits on the Ink sidebar. -->
