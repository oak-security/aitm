name: release

# Build the signed + notarized macOS installer on a version tag and publish it to a
# GitHub Release (which is also the electron-updater feed).
#
# macOS is the only platform we ship binaries for: the Windows and Linux builds are
# unsigned and untested, so they are documented as build-from-source instructions in
# the README instead of being published here.
#
# Required repo secrets for a signed + notarized build (all optional — without them the
# build is produced unsigned):
#   MAC_CSC_LINK              base64 of the Developer ID Application .p12
#   MAC_CSC_KEY_PASSWORD      password for that .p12
#   APPLE_ID                  Apple ID email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
#   APPLE_TEAM_ID             10-char team id (e.g. V863M8NPN9) — also enables notarization

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and publish
        shell: bash
        run: |
          set -x
          node --version
          node node_modules/electron-builder/cli.js --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
